spring.application.name=T1-FeignGrupo1

# Puerto distinto para poder correr este proyecto junto a appGrupo1Consumidor (8080)
# y appGrupo1Productor (8081) sin conflictos.
server.port=8082

# Timeouts razonables para las llamadas Feign a las APIs externas
spring.cloud.openfeign.client.config.default.connect-timeout=5000
spring.cloud.openfeign.client.config.default.read-timeout=5000
